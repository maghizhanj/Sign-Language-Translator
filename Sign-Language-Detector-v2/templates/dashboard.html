<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Language Assistant</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#111;
            color:white;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .container{
            width:100%;
            max-width:900px;
            text-align:center;
        }

        h1{
            margin-bottom:20px;
            color:pink;
        }

        .camera{
            width:100%;
            max-width:700px;
            border-radius:12px;
            border:3px solid pink;
            margin-bottom:20px;
        }

        .info-box{
            background:#1c1c1c;
            padding:15px;
            margin:10px 0;
            border-radius:10px;
        }

        .info-box p{
            margin-top:8px;
            font-size:20px;
            color:#00ff99;
            word-wrap:break-word;
        }

        .controls{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
            gap:10px;
            margin:20px 0;
        }

        button{
            padding:15px;
            border:none;
            border-radius:10px;
            background:pink;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
            font-weight:bold;
        }

        button:hover{
            background:#ffb0be;
        }

        .navigation{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:10px;
            margin-top:20px;
        }

        a{
            text-decoration:none;
        }

        @media(max-width:600px){

            h1{
                font-size:24px;
            }

            button{
                width:100%;
            }

            .navigation{
                grid-template-columns:1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <h1>Sign Language Assistant</h1>

    <img
        src="/video_feed"
        alt="Camera Feed"
        class="camera"
    >

    <div class="info-box">
        <h2>Current Sign</h2>
        <p id="sign">-</p>
    </div>

    <div class="info-box">
        <h2>Sentence</h2>
        <p id="sentence"></p>
    </div>

    <div class="controls">

        <button onclick="fetch('/add-character')">
            Add Character
        </button>

        <button onclick="fetch('/add-space')">
            Space
        </button>

        <button onclick="fetch('/backspace')">
            Backspace
        </button>

        <button onclick="fetch('/clear-sentence')">
            Clear
        </button>

        <button onclick="fetch('/speak')">
            Speak
        </button>

    </div>

    <div class="navigation">

        <a href="/text-to-sign">
            <button>
                Text → Sign
            </button>
        </a>

        <a href="/train-sign">
            <button>
                Train New Sign
            </button>
        </a>

    </div>

</div>

<script>

function updateData(){

    fetch("/get-current-sign")
    .then(response => response.json())
    .then(data => {
        document.getElementById("sign").innerText =
        data.sign || "-";
    });

    fetch("/get-sentence")
    .then(response => response.json())
    .then(data => {
        document.getElementById("sentence").innerText =
        data.sentence || "";
    });

}

setInterval(updateData,500);

updateData();

</script>

</body>
</html>
